services:
  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck: {test: ["CMD-SHELL","/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"], interval: 5s, timeout: 5s, retries: 20}
  kafka-init:
    image: apache/kafka:3.8.1
    depends_on: {kafka: {condition: service_healthy}}
    command: ["bash","-c","for t in envios.estados envios.promesas envios.reprogramaciones alertas.sla notificaciones.enviadas envios.estados.dlq; do /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1; done"]
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8080:8080"]
    environment: {KAFKA_CLUSTERS_0_NAME: rutasur, KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092}
    depends_on: [kafka]
  mongo:
    image: mongo:7
    command: ["mongod","--replSet","rs0","--bind_ip_all"]
    ports: ["27017:27017"]
    healthcheck: {test: ["CMD","mongosh","--quiet","--eval","db.adminCommand('ping').ok"], interval: 5s, timeout: 5s, retries: 20}
  mongo-init:
    image: mongo:7
    depends_on: {mongo: {condition: service_healthy}}
    entrypoint: ["bash","-c","mongosh --host mongo:27017 --eval 'try{rs.status()}catch(e){rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]})}'"]
  simulator: &svc
    build: {context: ., dockerfile: Dockerfile.service, args: {SERVICE: simulator}}
    environment: {KAFKA_BROKER: kafka:9092, MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0}
    ports: ["3010:3010"]
    depends_on: [kafka-init,mongo-init]
  projector:
    <<: *svc
    build: {context: ., dockerfile: Dockerfile.service, args: {SERVICE: projector}}
    ports: []
  notifications:
    <<: *svc
    build: {context: ., dockerfile: Dockerfile.service, args: {SERVICE: notifications}}
    ports: []
  rescheduler:
    <<: *svc
    build: {context: ., dockerfile: Dockerfile.service, args: {SERVICE: rescheduler}}
    ports: []
  sla-monitor:
    <<: *svc
    build: {context: ., dockerfile: Dockerfile.service, args: {SERVICE: sla-monitor}}
    ports: []
  analytics:
    <<: *svc
    build: {context: ., dockerfile: Dockerfile.service, args: {SERVICE: analytics}}
    ports: []
  web:
    build: ./web
    ports: ["3000:3000"]
    environment: {MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0}
    depends_on: [projector]
